name: TableReadApp
options:
  bundleIdPrefix: com.tableread
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  TableReadApp:
    type: application
    platform: iOS
    sources:
      - TableReadApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tableread.pokertracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TableRead
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_TableReadAPIBaseURL: "$(TABLEREAD_API_BASE_URL)"
        TABLEREAD_API_BASE_URL: "https://table-read-mobile-api.invalid"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - TableReadAppTests
  TableReadAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TableReadAppTests
    dependencies:
      - target: TableReadApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
