name: Deploy Cloudflare Mobile API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-mobile-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAIRING_ADMIN_SECRET: ${{ secrets.TABLEREAD_PAIRING_ADMIN_SECRET }}
      WORKER_NAME: table-read-mobile-api
      D1_NAME: table-read-mobile-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PAIRING_ADMIN_SECRET; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::$variable is not configured as a GitHub Actions secret."
              exit 2
            fi
          done

      - name: Ensure workers.dev account subdomain
        id: workers_subdomain
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth=(--header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json')

          current_json="$(curl --silent --show-error "${auth[@]}" "$api" || true)"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$current_json" 2>/dev/null || true)"

          if [[ -z "$subdomain" ]]; then
            echo "No workers.dev account subdomain exists; registering one."
            last_response=''
            for candidate in tableread-poker-tracker tableread-poker tableread-mobile-api; do
              echo "Trying workers.dev subdomain: $candidate"
              last_response="$(curl --silent --show-error --request PUT "${auth[@]}" \
                --data "$(jq -nc --arg subdomain "$candidate" '{subdomain:$subdomain}')" \
                "$api" || true)"
              if jq -e '.success == true' >/dev/null 2>&1 <<<"$last_response"; then
                subdomain="$(jq -r '.result.subdomain // empty' <<<"$last_response")"
                break
              fi
            done

            if [[ -z "$subdomain" ]]; then
              echo "::error::Unable to register a workers.dev account subdomain."
              jq -r '.errors[]?.message // empty' <<<"$last_response" || true
              exit 6
            fi
          else
            echo "Using existing workers.dev account subdomain: $subdomain"
          fi

          echo "subdomain=$subdomain" >> "$GITHUB_OUTPUT"

      - name: Discover or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          auth=(--header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json')

          list_json="$(curl --fail --silent --show-error "${auth[@]}" "$api?name=$D1_NAME&per_page=100")"
          database_id="$(jq -r --arg name "$D1_NAME" '.result[]? | select(.name == $name) | .uuid' <<<"$list_json" | head -n1)"

          if [[ -z "$database_id" ]]; then
            echo "Creating D1 database $D1_NAME"
            create_json="$(curl --fail --silent --show-error --request POST "${auth[@]}" --data "$(jq -nc --arg name "$D1_NAME" '{name:$name}')" "$api")"
            database_id="$(jq -r '.result.uuid // empty' <<<"$create_json")"
          else
            echo "Using existing D1 database $D1_NAME"
          fi

          if [[ -z "$database_id" ]]; then
            echo "::error::Cloudflare did not return a D1 database UUID."
            exit 3
          fi

          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "D1 database resolved."

      - name: Generate production Wrangler config
        shell: bash
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg databaseId "$DATABASE_ID" \
            --arg workerName "$WORKER_NAME" \
            --arg databaseName "$D1_NAME" \
            '{
              "$schema":"../../node_modules/wrangler/config-schema.json",
              name:$workerName,
              main:"src/index.ts",
              compatibility_date:"2026-08-30",
              workers_dev:true,
              preview_urls:false,
              d1_databases:[{
                binding:"DB",
                database_name:$databaseName,
                database_id:$databaseId,
                migrations_dir:"migrations"
              }],
              vars:{
                DEFAULT_OWNER_KEY:"primary-owner",
                ALLOWED_ORIGIN:"https://table-read-poker-tracker.xac30x.chatgpt.site"
              }
            }' > cloudflare/mobile-api/wrangler.deploy.json

      - name: Compile Worker
        run: npm run mobile-api:check

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote --config cloudflare/mobile-api/wrangler.deploy.json

      - name: Install pairing administrator secret
        shell: bash
        run: printf '%s' "$PAIRING_ADMIN_SECRET" | npx wrangler secret put PAIRING_ADMIN_SECRET --config cloudflare/mobile-api/wrangler.deploy.json

      - name: Deploy Worker
        run: npx wrangler deploy --config cloudflare/mobile-api/wrangler.deploy.json

      - name: Resolve public workers.dev URL
        id: public_url
        shell: bash
        env:
          ACCOUNT_SUBDOMAIN: ${{ steps.workers_subdomain.outputs.subdomain }}
        run: |
          set -euo pipefail
          if [[ -z "$ACCOUNT_SUBDOMAIN" ]]; then
            echo "::error::Cloudflare Workers account subdomain is unavailable."
            exit 4
          fi
          url="https://$WORKER_NAME.$ACCOUNT_SUBDOMAIN.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Public API: $url"

      - name: Verify production health endpoint
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.public_url.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            body="$(curl --silent --show-error --max-time 15 "$PUBLIC_URL/health" || true)"
            if jq -e '.ok == true and .service == "tableread-mobile-api"' >/dev/null 2>&1 <<<"$body"; then
              echo "Cloudflare mobile API is healthy at $PUBLIC_URL"
              exit 0
            fi
            echo "Health check attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "::error::Deployed Worker did not pass its health check."
          exit 5

      - name: Verify native auth and sync contract
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.public_url.outputs.url }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          user_agent='TableRead/1 CFNetwork iPhone'

          invalid_exchange_status="$(curl --silent --show-error --user-agent "$user_agent" \
            --output "$work/invalid-exchange.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"code":"AAAAAAAA","deviceName":"Production Smoke Test"}' \
            "$PUBLIC_URL/api/mobile/exchange")"
          [[ "$invalid_exchange_status" == "401" ]]
          jq -e '.error == "Invalid or expired pairing code."' "$work/invalid-exchange.json" >/dev/null

          invalid_sync_status="$(curl --silent --show-error --user-agent "$user_agent" \
            --output "$work/invalid-sync.json" --write-out '%{http_code}' \
            --header 'Authorization: Bearer tr_live_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' \
            "$PUBLIC_URL/api/mobile/sync")"
          [[ "$invalid_sync_status" == "401" ]]
          jq -e '.error == "Invalid mobile session."' "$work/invalid-sync.json" >/dev/null

          pair_response="$(curl --fail --silent --show-error --user-agent "$user_agent" \
            --request POST --header 'Content-Type: application/json' \
            --header "X-Admin-Secret: $PAIRING_ADMIN_SECRET" \
            --data '{}' "$PUBLIC_URL/api/mobile/pair")"
          code="$(jq -r '.code // empty' <<<"$pair_response")"
          [[ ${#code} -eq 8 ]]
          echo "::add-mask::$code"

          exchange_response="$(curl --fail --silent --show-error --user-agent "$user_agent" \
            --request POST --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg code "$code" '{code:$code,deviceName:"Production Smoke Test"}')" \
            "$PUBLIC_URL/api/mobile/exchange")"
          token="$(jq -r '.token // empty' <<<"$exchange_response")"
          [[ "$token" == tr_live_* ]]
          echo "::add-mask::$token"

          snapshot="$(curl --fail --silent --show-error --user-agent "$user_agent" \
            --header "Authorization: Bearer $token" \
            "$PUBLIC_URL/api/mobile/sync")"
          jq -e '.players | type == "array"' <<<"$snapshot" >/dev/null
          jq -e '.observations | type == "array"' <<<"$snapshot" >/dev/null
          jq -e '.truncated | type == "boolean"' <<<"$snapshot" >/dev/null

          curl --fail --silent --show-error --user-agent "$user_agent" \
            --request POST --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $token" --data '{}' \
            "$PUBLIC_URL/api/mobile/revoke" >/dev/null

          revoked_status="$(curl --silent --show-error --user-agent "$user_agent" \
            --output "$work/revoked.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" \
            "$PUBLIC_URL/api/mobile/sync")"
          [[ "$revoked_status" == "401" ]]
          jq -e '.error == "Invalid mobile session."' "$work/revoked.json" >/dev/null

          echo 'Native pairing, bearer sync, and revocation contract passed.'

      - name: Deployment summary
        env:
          PUBLIC_URL: ${{ steps.public_url.outputs.url }}
        run: |
          {
            echo '## TableRead Cloudflare Mobile API'
            echo
            echo "- Public API: $PUBLIC_URL"
            echo "- Pairing page: $PUBLIC_URL/pair"
            echo "- Health: $PUBLIC_URL/health"
            echo '- D1 migrations: applied'
            echo '- Pairing secret: installed as an encrypted Worker secret'
            echo '- Native auth/sync smoke test: passed'
          } >> "$GITHUB_STEP_SUMMARY"
