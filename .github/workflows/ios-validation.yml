name: iOS Validation

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-validation.yml"
      - ".github/workflows/testflight-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-validation.yml"
      - ".github/workflows/testflight-release.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Validate release configuration
        working-directory: ios
        run: |
          set -euo pipefail
          bash -n scripts/release-testflight.sh
          plutil -lint TableReadApp/PrivacyInfo.xcprivacy
          altool_help="$(xcrun altool --help 2>&1)"
          grep -q -- '--apiKey' <<< "$altool_help"
          grep -q -- '--apiIssuer' <<< "$altool_help"
          grep -q -- 'API_PRIVATE_KEYS_DIR' <<< "$altool_help"
          test "$(sips -g pixelWidth TableReadApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | awk '/pixelWidth/ {print $2}')" = '1024'
          test "$(sips -g pixelHeight TableReadApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | awk '/pixelHeight/ {print $2}')" = '1024'
          test "$(sips -g hasAlpha TableReadApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | awk '/hasAlpha/ {print $2}')" = 'no'

      - name: Build app and tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project TableReadApp.xcodeproj \
            -scheme TableReadApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Build unsigned Release app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project TableReadApp.xcodeproj \
            -scheme TableReadApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
