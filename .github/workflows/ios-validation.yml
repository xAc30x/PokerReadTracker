name: iOS Validation

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-validation.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app and tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project TableReadApp.xcodeproj \
            -scheme TableReadApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
